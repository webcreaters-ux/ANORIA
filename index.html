<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101426">
  <meta name="description" content="ANORIA — a cinematic fantasy adventure game for the web.">
  <title>ANORIA — Fantasy Adventure</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="app">
    <section id="title-screen" class="screen active">
      <div class="stars"></div><div class="moon"></div>
      <div class="title-wrap">
        <div class="crest" aria-hidden="true">✦</div>
        <h1>ANORIA</h1>
        <p class="subtitle">THE SHARDS OF DAWN</p>
        <p class="tagline">A fantasy adventure beyond the last star.</p>
        <button id="start-btn" class="primary">Begin Adventure</button>
        <button id="continue-btn" class="secondary hidden">Continue Journey</button>
        <button id="how-btn" class="text-btn">How to Play</button>
      </div>
      <div class="version">ANORIA • 2026</div>
    </section>

    <section id="game-screen" class="screen">
      <header class="hud">
        <div class="brand">ANORIA</div>
        <div class="hud-center"><span id="chapter-label">Chapter I</span><span id="location-label">Whispering Vale</span></div>
        <div class="hud-actions"><button id="journal-btn" class="icon-btn" title="Journal">📖</button><button id="sound-btn" class="icon-btn" title="Sound">🔊</button><button id="pause-btn" class="icon-btn" title="Pause">Ⅱ</button></div>
      </header>
      <div id="scene" class="scene">
        <div class="scene-sky"></div><div class="scene-moon"></div><div class="mountains back"></div><div class="mountains front"></div><div id="particles"></div>
        <div id="scene-art" class="scene-art"></div>
        <div class="quest-card"><span id="quest-type">MAIN QUEST</span><strong id="quest-title">The First Shard</strong><small id="quest-text">Follow the blue fireflies into the ancient vale.</small></div>
        <div id="dialogue" class="dialogue hidden"><div class="speaker" id="speaker"></div><div id="dialogue-text"></div><button id="dialogue-next" class="primary small">Continue</button></div>
        <div id="choice-panel" class="choice-panel hidden"></div>
        <div class="location-banner" id="location-banner">WHISPERING VALE</div>
      </div>
      <nav class="controls">
        <div class="dpad"><button data-move="up">▲</button><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div>
        <div class="actions"><button id="interact-btn">✦<span>Interact</span></button><button id="inventory-btn">🎒<span>Inventory</span></button><button id="map-btn">🗺<span>Map</span></button></div>
      </nav>
    </section>

    <section id="overlay" class="overlay hidden"><div class="modal"><button id="close-modal" class="close">×</button><div id="modal-content"></div></div></section>
  </main>
  <script src="game.js"></script>
</body>
</html>
